# Stack completo en local, sin tocar el Convex de prod: backend de Convex autoalojado + dashboard + la app.
# Se levanta con ./local.sh (genera la clave de admin, configura las keys y despliega las funciones).
#   app        http://localhost:5173   (Vite, apunta al backend local)
#   backend    http://localhost:3210   (Convex autoalojado; los datos viven en el volumen convex-data)
#   dashboard  http://localhost:6791   (tablas, logs y funciones del backend local)
# Base de datos de cero: docker compose down -v
services:
  backend:
    image: ghcr.io/convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 # the browser uploads audio to URLs built from this
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DISABLE_BEACON=true
      - RUST_LOG=info
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      backend:
        condition: service_healthy

  # Pushes convex/ to the local backend on every change (convex dev) and serves the web with Vite.
  app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules # Linux deps, separate from the host's macOS node_modules
    env_file:
      - path: .env.docker # written by local.sh: CONVEX_SELF_HOSTED_ADMIN_KEY
        required: false
    environment:
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
      - VITE_CONVEX_URL=http://127.0.0.1:3210 # seen from the browser, not from the container
      - CHOKIDAR_USEPOLLING=true # file changes through the macOS bind mount
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    ports:
      - "5173:5173"
    command: sh -c "corepack enable && ([ -d node_modules/.bin ] || pnpm install --frozen-lockfile) && (pnpm exec convex dev & exec pnpm exec vite --host 0.0.0.0)"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:
  node-modules:
