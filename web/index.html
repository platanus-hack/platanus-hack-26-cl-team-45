<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audem</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>
<!-- Shared lit-sphere fills for tone dots (fill="url(#g-pos)" etc.) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="g-pos" cx="33%" cy="28%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".16" style="stop-color:color-mix(in srgb, var(--pos), #fff 45%)"/><stop offset=".5" style="stop-color:var(--pos)"/><stop offset="1" style="stop-color:color-mix(in srgb, var(--pos), #1e1719 45%)"/></radialGradient>
  <radialGradient id="g-neu" cx="33%" cy="28%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".16" style="stop-color:color-mix(in srgb, var(--neu), #fff 45%)"/><stop offset=".5" style="stop-color:var(--neu)"/><stop offset="1" style="stop-color:color-mix(in srgb, var(--neu), #1e1719 45%)"/></radialGradient>
  <radialGradient id="g-neg" cx="33%" cy="28%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".16" style="stop-color:color-mix(in srgb, var(--neg), #fff 45%)"/><stop offset=".5" style="stop-color:var(--neg)"/><stop offset="1" style="stop-color:color-mix(in srgb, var(--neg), #1e1719 45%)"/></radialGradient>
  <radialGradient id="g-perla" cx="36%" cy="26%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fdf4f2"/><stop offset="1" stop-color="#f7dfda"/></radialGradient>
</defs></svg>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
